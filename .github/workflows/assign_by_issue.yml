name: Execute Role Assignment via Issue Form

on:
  issues:
    types: [opened]

jobs:
  assign:
    if: contains(github.event.issue.labels.*.name, 'role-assignment-trigger')
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Parse Issue Body
      uses: stefanbuck/github-issue-parser@v3
      id: issue-parser
      with:
        template_path: .github/ISSUE_TEMPLATE/role_assign_form.yml

    # データを安全に一時ファイルへ保存する（改行エラーの防止）
    - name: Save inputs to temporary files
      run: |
        cat << 'EOF' > temp_roles.txt
        ${{ steps.issue-parser.outputs.issueparser_roles_text }}
        EOF
        cat << 'EOF' > temp_prefs.txt
        ${{ steps.issue-parser.outputs.issueparser_preferences_text }}
        EOF

    # 一時ファイルへのパスを渡してスクリプトを実行
    - name: Run assignment script
      env:
        INPUT_MODE: ${{ steps.issue-parser.outputs.issueparser_mode }}
      run: |
        python assign.py --mode "$INPUT_MODE" --roles_file temp_roles.txt --prefs_file temp_prefs.txt > result.txt

    # 割り振り結果をIssueのコメントに投稿する
    - name: Create Comment with Results
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.issue.number }}
        body-file: result.txt

    # 最後にIssueを自動でクローズする
    - name: Close Issue
      if: always()
      run: gh issue close ${{ github.event.issue.number }} --comment "割り当て処理が正常に完了しました。"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
