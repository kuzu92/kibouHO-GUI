name: Execute Role Assignment via Issue Form

on:
  issues:
    types: [opened]

jobs:
  assign:
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ✨ 【追加】送信直後に「処理開始」のコメントを即座に投稿する
    - name: Comment Start Message
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.issue.number }}
        body: "⏳ ただいま自動割り当ての計算を開始しました。結果が出るまで約10秒ほどこのままお待ちください..."

    # ーーー 以下はこれまでの処理 ーーー
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Save raw issue body
      env:
        RAW_BODY: ${{ github.event.issue.body }}
      run: |
        echo "$RAW_BODY" > raw_issue.txt

    - name: Run assignment script
      run: |
        python assign.py --issue_file raw_issue.txt > result.txt

    - name: Create Comment with Results
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.issue.number }}
        body-file: result.txt

    - name: Close Issue
      if: always()
      run: gh issue close ${{ github.event.issue.number }} --comment "割り当て処理が正常に完了しました。"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
