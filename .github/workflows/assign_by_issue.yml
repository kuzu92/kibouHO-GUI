name: Execute Role Assignment via Issue Form

on:
  issues:
    types: [opened]

jobs:
  assign:
    # 修正点1: 権限を明示的に指定
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # (中略: Python設定とIssue解析)
    
    - name: Run script & Save result
      # ... (スクリプト実行)
      run: |
        echo "### 📊 役職自動割り当て結果" > comment_body.txt
        python assign.py ... >> comment_body.txt
        
    - name: Create Comment
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.issue.number }}
        body-file: comment_body.txt # 修正点2: ファイルからコメントを読み込む

    # 修正点3: コメント作成後にクローズする（順序の確実化）
    - name: Close Issue
      if: always()
      run: gh issue close ${{ github.event.issue.number }} --comment "完了"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
