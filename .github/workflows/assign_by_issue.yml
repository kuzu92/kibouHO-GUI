name: Execute Role Assignment via Issue Form

on:
  issues:
    types: [opened]

jobs:
  assign:
    if: contains(github.event.issue.labels.*.name, 'role-assignment-trigger')
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    # 送信されたIssueの本文全体をそのままテキストファイルに保存
    - name: Save raw issue body
      env:
        RAW_BODY: ${{ github.event.issue.body }}
      run: |
        echo "$RAW_BODY" > raw_issue.txt

    # Pythonスクリプトを起動。生ファイルをそのまま渡す
    - name: Run assignment script
      run: |
        python assign.py --issue_file raw_issue.txt > result.txt

    # 結果をIssueのコメントに投稿する
    - name: Create Comment with Results
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.issue.number }}
        body-file: result.txt

    # 最後にIssueを自動でクローズする
    - name: Close Issue
      if: always()
      run: gh issue close ${{ github.event.issue.number }} --comment "割り当て処理が正常に完了しました。"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
