name: Execute Role Assignment via Issue Form

on:
  issues:
    types: [opened]

jobs:
  assign:
    if: contains(github.event.issue.labels.*.name, 'role-assignment-trigger')
    runs-on: ubuntu-latest
    permissions:
      issues: write # 結果をIssueに書き込む権限

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    # Issueのフォームから入力値(Markdown)をパースして環境変数に格納するアクション
    - name: Parse Issue Body
      uses: stefanbuck/github-issue-parser@v3
      id: issue-parser
      with:
        template_path: .github/ISSUE_TEMPLATE/role_assign_form.yml

    # パースした値を引数としてPythonスクリプトを実行し、結果をファイルに保存
    - name: Run assignment script
      env:
        INPUT_MODE: ${{ steps.issue-parser.outputs.issueparser_mode }}
        INPUT_ROLES: ${{ steps.issue-parser.outputs.issueparser_roles_text }}
        INPUT_PREFS: ${{ steps.issue-parser.outputs.issueparser_preferences_text }}
      run: |
        python assign.py --mode "$INPUT_MODE" --roles "$INPUT_ROLES" --prefs "$INPUT_PREFS" > result.txt

    # 割り振った結果を、Issueのコメントとして自動返信する
    - name: Create Comment with Results
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.issue.number }}
        body-file: result.txt

    # 最後に、履歴が残らないようにIssueを自動でクローズ（終了）する
    - name: Close Issue
      run: gh issue close ${{ github.event.issue.number }} --comment "割り当てが完了したため、この画面を自動で閉じます。"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
