name: Execute Role Assignment via Issue Form

on:
  issues:
    types: [opened]

jobs:
  assign:
    if: contains(github.event.issue.labels.*.name, 'role-assignment-trigger')
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Comment Start Message
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.issue.number }}
        body: "⏳ ただいま自動割り当ての計算を開始しました。結果が出るまで約10秒ほどこのままお待ちください..."

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Save raw issue body
      env:
        RAW_BODY: ${{ github.event.issue.body }}
      run: |
        echo "$RAW_BODY" > raw_issue.txt

    # ✨ 修正点1: エラーが発生（終了コード1）しても途中で強制終了せず、処理を次に進める設定 (continue-on-error)
    - name: Run assignment script
      id: run_script
      continue-on-error: true
      run: |
        python assign.py --issue_file raw_issue.txt > result.txt

    # ✨ 修正点2: 計算成功・失敗に関わらず(if: always)、必ず作成された result.txt の中身をコメントする
    - name: Create Comment with Results
      if: always()
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.issue.number }}
        body-file: result.txt

    # ✨ 修正点3: プログラムの成否に合わせて、最後に投稿するクローズ時のコメント文を動的に切り替える
    - name: Close Issue
      if: always()
      run: |
        if [ "${{ steps.run_script.outcome }}" = "success" ]; then
          gh issue close ${{ github.event.issue.number }} --comment "割り当て処理が正常に完了しました。"
        else
          gh issue close ${{ github.event.issue.number }} --comment "⚠️ 入力エラーを検知したため処理を中断しました。上記のエラー内容を確認し、新しいIssueからやり直してください。"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
