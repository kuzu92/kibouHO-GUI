name: Execute Role Assignment (GUI)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '割り当てモードを選択してください'
        required: true
        type: choice
        default: 'fairness_first'
        options:
          - fairness_first
          - satisfaction_first
      roles_text:
        description: '【役職の定員】 (例: HO1: 1 のように1行ずつ入力)'
        required: true
        type: string
        default: |
          HO1: 1
          HO2: 1
          HO3: 1
          HO4: 1
      preferences_text:
        description: '【メンバーの希望順位】 (例: メンバー名,役職1:順位,役職2:順位... またはYAML形式)'
        required: true
        type: string
        default: |
          Member1: {HO1: 2, HO2: 2, HO3: 1, HO4: 1}
          Member2: {HO1: 1, HO2: 3, HO3: 3, HO4: 2}
          Member3: {HO1: 2, HO2: 1, HO3: 3, HO4: 1}
          Member4: {HO1: 2, HO2: 1, HO3: 1, HO4: 3}

jobs:
  assign:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    # 画面から入力されたテキストを引数としてPythonに渡して実行
    - name: Run assignment script
      env:
        INPUT_MODE: ${{ github.event.inputs.mode }}
        INPUT_ROLES: ${{ github.event.inputs.roles_text }}
        INPUT_PREFS: ${{ github.event.inputs.preferences_text }}
      run: |
        python assign.py --mode "$INPUT_MODE" --roles "$INPUT_ROLES" --prefs "$INPUT_PREFS" > result.txt
        cat result.txt

    - name: Upload result artifact
      uses: actions/upload-artifact@v4
      with:
        name: assignment-result
        path: result.txt
